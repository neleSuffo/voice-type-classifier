task:
  params:
    duration: 2.0
    batch_size: 64
    per_epoch: 1
    labels_spec:
      regular: ['kchi', 'och', 'mal', 'fem', 'ovh']
      union:
        speech: ['kchi', 'och', 'fem', 'mal', 'speech']
  name: MultilabelDetection
architecture:
  params:
    sincnet:
      out_channels: [256, 60, 60]
      kernel_size: [251, 5, 5]
    rnn:
      hidden_size: 128
      dropout: 0
      num_layers: 3
      unit: LSTM
      bidirectional: True
    ff:
      hidden_size: [128, 128]
  name: pyannote.audio.models.PyanNet
scheduler:
  name: CyclicScheduler
  params:
    learning_rate: auto
    epochs_per_cycle: 14
feature_extraction:
  name: RawAudio
  params:
    sample_rate: 16000
